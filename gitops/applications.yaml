apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liora-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dionis1/liora-devops-platform.git
    targetRevision: deploy/dev
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: liora-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: liora-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dionis1/liora-devops-platform.git
    targetRevision: main
    path: kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: liora-prod
  syncPolicy:
    # No automated policy: production requires manual Argo CD sync.
    syncOptions:
      - CreateNamespace=true
