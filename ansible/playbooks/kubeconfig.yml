---
- name: Check k3s and retrieve kubeconfig
  hosts: k3s_servers
  become: true
  tasks:
    - name: Check node status
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
      changed_when: false
      register: nodes
    - name: Print status
      ansible.builtin.debug:
        var: nodes.stdout_lines
    - name: Restrict the controller secrets directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
    - name: Fetch kubeconfig to an ignored folder on the controller
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../.secrets/k3s.yaml"
        flat: true
      no_log: true
    - name: Restrict the fetched controller kubeconfig
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.secrets/k3s.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
