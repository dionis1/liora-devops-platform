apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- application-observability.yaml
configMapGenerator:
- name: liora-fastapi-dashboard
  files:
  - fastapi.json=dashboards/fastapi.json
  options:
    labels:
      grafana_dashboard: '1'
generatorOptions:
  disableNameSuffixHash: true
