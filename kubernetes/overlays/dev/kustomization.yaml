apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: liora-dev
resources:
  - ../../base
images:
  - name: ghcr.io/dionis1/liora-devops-platform-backend
    newTag: sha-1e5085c9ccffa98ae7ea364690b40c6e00e6b55e
  - name: ghcr.io/dionis1/liora-devops-platform-frontend
    newTag: sha-1e5085c9ccffa98ae7ea364690b40c6e00e6b55e
patches:
  - target:
      kind: ConfigMap
      name: course-app-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
      - op: replace
        path: /data/FRONTEND_HOST
        value: http://dev.example.invalid
      - op: replace
        path: /data/BACKEND_CORS_ORIGINS
        value: http://dev.example.invalid
