apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: liora-prod
resources:
- ../../base
- namespace.yaml
images:
- name: ghcr.io/dionis1/liora-devops-platform-backend
  digest: sha256:1b5a8045185f9caae6d293c5d8d6398d4a1bbc6b8e23979b26cf871fac56738b
- name: ghcr.io/dionis1/liora-devops-platform-frontend
  digest: sha256:eeebf408bc90040dbf581d98d5092ecbe8d751d2398b82e8471e439ad406310e
patches:
- target:
    kind: ConfigMap
    name: course-app-config
  patch: "- op: replace\n  path: /data/ENVIRONMENT\n  value: production\n- op: replace\n\
    \  path: /data/FRONTEND_HOST\n  value: https://app.example.invalid\n- op: replace\n\
    \  path: /data/BACKEND_CORS_ORIGINS\n  value: https://app.example.invalid"
- target:
    kind: Ingress
    name: course-app
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: app.example.invalid"
- target:
    kind: Ingress
    name: course-app
  patch: "- op: add\n  path: /spec/tls\n  value:\n    - hosts: [app.example.invalid]\n\
    \      secretName: course-app-tls\n- op: add\n  path: /metadata/annotations\n\
    \  value:\n    traefik.ingress.kubernetes.io/router.entrypoints: websecure\n"
