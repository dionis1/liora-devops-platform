name: Validate platform manifests
on:
  workflow_call:
  pull_request:
    paths:
      - "infrastructure/**"
      - "ansible/**"
      - "kubernetes/**"
      - "gitops/**"
      - "monitoring/**"
      - ".github/workflows/validate-platform.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "ansible/**"
      - "kubernetes/**"
      - "gitops/**"
      - "monitoring/**"
      - ".github/workflows/validate-platform.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
      - name: Format configuration
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Initialize without connecting to Hetzner
        run: terraform -chdir=infrastructure/terraform init -backend=false
      - name: Validate Terraform configuration offline
        run: terraform -chdir=infrastructure/terraform validate

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.34.0"
      - name: Render development
        run: kubectl kustomize kubernetes/overlays/dev > /tmp/dev.yaml
      - name: Render monitoring
        run: kubectl kustomize monitoring > /tmp/monitoring.yaml
      - name: Render production
        run: kubectl kustomize kubernetes/overlays/prod > /tmp/prod.yaml
      - name: Require immutable production release images
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('/tmp/prod.yaml').read_text()
          assert 'sha-bootstrap' not in text, 'Production still contains placeholder images'
          images = re.findall(r'^\s+(?:- )?image: (\S+)', text, re.MULTILINE)
          app = [image for image in images if image.startswith('ghcr.io/dionis1/liora-devops-platform-')]
          assert len(app) == 3, 'Expected migration, backend and frontend images'
          assert all(re.fullmatch(r'ghcr.io/dionis1/liora-devops-platform-(backend|frontend)@sha256:[0-9a-f]{64}', image) for image in app), 'Production app images must use verified digests'
          assert len(set(image for image in app if '-backend@' in image)) == 1, 'Migration and backend must match'
          print('PASS immutable production backend, migration and frontend references')
          PYCODE
      - name: Check safe GitOps promotion and conflict handling
        run: python3 -m unittest discover -s tests -p test_promote_dev.py -v

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install "ansible-core==2.19.2"
      - name: Syntax validation
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini.example --syntax-check ansible/playbooks/prepare.yml
          ansible-playbook -i ansible/inventory/hosts.ini.example --syntax-check ansible/playbooks/k3s.yml
          ansible-playbook -i ansible/inventory/hosts.ini.example --syntax-check ansible/playbooks/kubeconfig.yml
