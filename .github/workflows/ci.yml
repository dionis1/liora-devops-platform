name: FastAPI course application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.15"
          enable-cache: true
          cache-dependency-glob: "course-app/backend/uv.lock"
      - name: Run upstream lint
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/lint.sh

  backend-tests:
    name: PostgreSQL and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.15"
          enable-cache: true
          cache-dependency-glob: "course-app/backend/uv.lock"
      - name: Start test dependencies
        working-directory: course-app
        run: docker compose up -d --wait db mailcatcher
      - name: Run upstream migrations
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/prestart.sh
      - name: Execute API tests
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/tests-start.sh "CI coverage"
      - name: Clean up
        if: always()
        working-directory: course-app
        run: docker compose down -v --remove-orphans

  build-pr:
    name: Validate Docker images
    if: github.event_name == 'pull_request'
    needs: [backend-lint, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: course-app/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: course-app/frontend
          push: false
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish:
    name: Publish backend and frontend to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-lint, backend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: course-app/backend
          push: true
          tags: ghcr.io/dionis1/liora-devops-platform-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: course-app/frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: ghcr.io/dionis1/liora-devops-platform-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  promote-dev:
    name: Promote published images to dev GitOps branch
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update dev image tags in Git (not direct cluster access)
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy/dev >/dev/null; then
            git fetch origin deploy/dev
            git switch -c deploy/dev --track origin/deploy/dev
          else
            git switch -c deploy/dev
          fi
          sed -i -E "s/(newTag: )sha-[a-z0-9]+/\\1${IMAGE_TAG}/g" kubernetes/overlays/dev/kustomization.yaml
          git add kubernetes/overlays/dev/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): promote dev images to ${IMAGE_TAG}"
            git push origin HEAD:refs/heads/deploy/dev
          fi
