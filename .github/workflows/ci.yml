name: FastAPI Course Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint upstream FastAPI backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.15"
          enable-cache: true
          cache-dependency-glob: "course-app/backend/uv.lock"
      - name: Run upstream linting
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/lint.sh

  backend-tests:
    name: PostgreSQL integration and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.15"
          enable-cache: true
          cache-dependency-glob: "course-app/backend/uv.lock"
      - name: Start temporary database and mailcatcher
        working-directory: course-app
        run: docker compose up -d --wait db mailcatcher
      - name: Run database migrations and initial data
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/prestart.sh
      - name: Execute upstream pytest suite
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
      - name: Stop test services
        if: always()
        working-directory: course-app
        run: docker compose down -v --remove-orphans

  docker-validate:
    name: Validate course Docker builds on PR
    if: github.event_name == 'pull_request'
    needs: [backend-lint, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build upstream backend
        uses: docker/build-push-action@v6
        with:
          context: ./course-app/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build upstream frontend
        uses: docker/build-push-action@v6
        with:
          context: ./course-app/frontend
          push: false
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish:
    name: Publish course images to GHCR on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-lint, backend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish upstream backend
        uses: docker/build-push-action@v6
        with:
          context: ./course-app/backend
          push: true
          tags: ghcr.io/dionis1/liora-devops-platform-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish upstream frontend
        uses: docker/build-push-action@v6
        with:
          context: ./course-app/frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ghcr.io/dionis1/liora-devops-platform-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
