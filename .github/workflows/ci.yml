name: FastAPI course application CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    uses: ./.github/workflows/validate-platform.yml

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: patches/course-app-platform.patch
      - run: bash scripts/prepare-course-app.sh
      - name: Run upstream lint
        working-directory: course-app/backend
        run: uv run --frozen bash scripts/lint.sh

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: patches/course-app-platform.patch
      - name: PostgreSQL 16, migrations, upstream tests and platform metrics
        run: bash scripts/test-backend.sh

  build-scan:
    name: Build and scan before publication
    needs: [platform, backend-lint, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - run: bash scripts/prepare-course-app.sh
      - uses: docker/setup-buildx-action@v4
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Gate dependencies, deployed configuration and secrets
        run: bash scripts/scan-security.sh
      - name: Build backend
        run: docker build -f docker/backend.Dockerfile -t liora-backend:ci course-app/backend
      - name: Test backend image against PostgreSQL 16
        run: python3 scripts/test-backend-image.py liora-backend:ci
      - name: Scan backend before publication
        run: trivy image --parallel 1 --severity HIGH,CRITICAL --exit-code 1 liora-backend:ci
      - name: Build frontend
        run: docker build -f docker/frontend.Dockerfile -t liora-frontend:ci course-app/frontend
      - name: Scan frontend before publication
        run: trivy image --parallel 1 --severity HIGH,CRITICAL --exit-code 1 liora-frontend:ci
      - name: Save the exact scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o /tmp/scanned-images.tar liora-backend:ci liora-frontend:ci
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: scanned-images
          path: /tmp/scanned-images.tar
          retention-days: 1
          compression-level: 1

  publish:
    name: Publish only scanned images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: scanned-images
          path: /tmp
      - run: docker load -i /tmp/scanned-images.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the scanned backend and frontend
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker tag liora-backend:ci ghcr.io/dionis1/liora-devops-platform-backend:$IMAGE_TAG
          docker push ghcr.io/dionis1/liora-devops-platform-backend:$IMAGE_TAG
          docker tag liora-frontend:ci ghcr.io/dionis1/liora-devops-platform-frontend:$IMAGE_TAG
          docker push ghcr.io/dionis1/liora-devops-platform-frontend:$IMAGE_TAG

  promote-dev:
    name: Promote validated manifests and scanned images
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update dev in Git; production remains manual
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy/dev >/dev/null; then
            git fetch origin deploy/dev
            git switch -c deploy/dev --track origin/deploy/dev
            git merge --no-edit "$GITHUB_SHA"
          else
            git switch -c deploy/dev
          fi
          sed -i -E "s/(newTag: )sha-[a-z0-9]+/\\1$IMAGE_TAG/g" kubernetes/overlays/dev/kustomization.yaml
          git add kubernetes/overlays/dev/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): promote scanned dev images to $IMAGE_TAG"
            git push origin HEAD:refs/heads/deploy/dev
          fi
