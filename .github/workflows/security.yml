name: Security audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trivy-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - run: ./scripts/prepare-course-app.sh
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Scan patched dependencies and deployed configuration
        run: ./scripts/scan-security.sh
